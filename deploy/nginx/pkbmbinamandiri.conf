# ============================================================
# Nginx Configuration Template — PKBM Bina Mandiri
# File: /etc/nginx/sites-available/pkbmbinamandiri.conf
# ============================================================

# 1. Redirect HTTP ke HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name pkbmbinamandiri.sch.id www.pkbmbinamandiri.sch.id;

    # Certbot renewal validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Server HTTPS Utama
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pkbmbinamandiri.sch.id www.pkbmbinamandiri.sch.id;

    # SSL Certificate (dibuat via: sudo certbot --nginx -d pkbmbinamandiri.sch.id)
    # ssl_certificate /etc/letsencrypt/live/pkbmbinamandiri.sch.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/pkbmbinamandiri.sch.id/privkey.pem;

    # Batas ukuran upload file (SPMB, berkas tugas, materi hingga 50MB)
    client_max_body_size 50M;

    # Frontend Single Page Application (SPA)
    root /var/www/pkbm/frontend/dist;
    index index.html;

    # Routing SPA: Jika file fisik tidak ada, arahkan ke index.html
    # PENTING: Jangan pernah cache index.html agar mobile/desktop selalu dapat tampilan terbaru secara realtime
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }

    # PENTING: Jangan cache index.html agar update tampilan langsung muncul tanpa harus refresh berulang kali
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }

    # Proxy REST API ke Express Backend (Port 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # Proxy Folder Uploads (atau bisa langsung via Express)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Cache file statis assets (js, css, fonts, images)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
