<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 1. Rich Deep Emerald Pine Base Gradient -->
    <linearGradient id="execBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021B14" />
      <stop offset="30%" stop-color="#052E23" />
      <stop offset="65%" stop-color="#084E3A" />
      <stop offset="100%" stop-color="#0D694E" />
    </linearGradient>

    <!-- 2. Ambient Lights (Cinematic Emerald, Mint & Amber Sheen) -->
    <!-- Mascot Ambient Light (Right Area) -->
    <radialGradient id="mascotBackGlow" cx="88%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#059669" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#021B14" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Luminous Mint Sheen (Top Left Ambient) -->
    <radialGradient id="mintAmbient" cx="15%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#021B14" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Warm Gold Sheen (Bottom Left Ambient under buttons) -->
    <radialGradient id="goldAmbient" cx="20%" cy="88%" r="42%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.1" />
      <stop offset="60%" stop-color="#021B14" stop-opacity="0" />
    </radialGradient>

    <!-- 3. Dynamic Wave Ribbon Gradients -->
    <linearGradient id="ribbonGrad1" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.04" />
      <stop offset="30%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#34D399" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6EE7B7" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="ribbonGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.05" />
      <stop offset="45%" stop-color="#34D399" stop-opacity="0.32" />
      <stop offset="85%" stop-color="#6EE7B7" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#A7F3D0" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="ribbonGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0.35" />
    </linearGradient>

    <!-- Ribbon Surface Fill Gradient (Translucent 3D wave sheet) -->
    <linearGradient id="waveSheetFill1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0" />
      <stop offset="40%" stop-color="#059669" stop-opacity="0.1" />
      <stop offset="75%" stop-color="#10B981" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.04" />
    </linearGradient>

    <linearGradient id="waveSheetFill2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065F46" stop-opacity="0" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.08" />
      <stop offset="85%" stop-color="#34D399" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#021B14" stop-opacity="0" />
    </linearGradient>

    <!-- 4. Precision Tech Grid (Clean Emerald Grid) -->
    <pattern id="precisionGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#34D399" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>

    <!-- Grid Mask: Soft fade out towards the left so typography is ultra crisp -->
    <linearGradient id="gridFadeMask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.02" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
    </linearGradient>
    <mask id="fadeMaskGrid">
      <rect width="1600" height="400" fill="url(#gridFadeMask)" />
    </mask>

    <!-- Glow Filter for subtle lighting effects -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ================= BACKGROUND LAYERS ================= -->
  <!-- 1. Deep Royal Pine Gradient -->
  <rect width="1600" height="400" fill="url(#execBgGrad)" />

  <!-- 2. Ambient Lights -->
  <rect width="1600" height="400" fill="url(#mintAmbient)" />
  <rect width="1600" height="400" fill="url(#goldAmbient)" />
  <rect width="1600" height="400" fill="url(#mascotBackGlow)" />

  <!-- 3. Precision Engineering Tech Grid -->
  <rect width="1600" height="400" fill="url(#precisionGrid)" mask="url(#fadeMaskGrid)" />

  <!-- ================= TRANSLUCENT 3D FLOW RIBBON SURFACES ================= -->
  <!-- Surface Sheet 1 (Luminous Mesh Flow) -->
  <path d="M-50,330 
           C280,390 520,270 820,310 
           C1120,350 1340,240 1650,260 
           L1650,380 
           C1340,360 1120,410 820,380 
           C520,350 280,420 -50,380 Z" 
        fill="url(#waveSheetFill1)" />

  <!-- Surface Sheet 2 (Midwave Fluid Accent) -->
  <path d="M-50,240 
           C260,300 480,180 780,220 
           C1080,260 1320,150 1650,170 
           L1650,230 
           C1320,210 1080,300 780,270 
           C480,240 260,330 -50,290 Z" 
        fill="url(#waveSheetFill2)" />

  <!-- ================= HIGH-PRECISION FLOW CURVES (Topographic / Wave Ribbons) ================= -->
  <g fill="none" stroke-linecap="round">
    <!-- Stream 1 (Deep Base Wave) -->
    <path d="M-50,350 C300,410 540,290 840,330 C1140,370 1360,260 1650,280" stroke="url(#ribbonGrad1)" stroke-width="2" />
    <path d="M-50,330 C300,390 540,270 840,310 C1140,350 1360,240 1650,260" stroke="url(#ribbonGrad2)" stroke-width="1.4" />
    <path d="M-50,310 C300,370 540,250 840,290 C1140,330 1360,220 1650,240" stroke="url(#ribbonGrad3)" stroke-width="1" stroke-dasharray="6 8" />

    <!-- Stream 2 (Mid Dynamic Wave) -->
    <path d="M-50,260 C260,320 480,200 780,240 C1080,280 1320,170 1650,190" stroke="url(#ribbonGrad2)" stroke-width="2.2" filter="url(#subtleGlow)" />
    <path d="M-50,240 C260,300 480,180 780,220 C1080,260 1320,150 1650,170" stroke="url(#ribbonGrad1)" stroke-width="1.6" />
    <path d="M-50,220 C260,280 480,160 780,200 C1080,240 1320,130 1650,150" stroke="url(#ribbonGrad3)" stroke-width="1.2" />

    <!-- Stream 3 (Upper Fine Horizon Waves) -->
    <path d="M-50,170 C240,220 450,120 740,160 C1030,200 1280,90 1650,110" stroke="url(#ribbonGrad1)" stroke-width="1.8" />
    <path d="M-50,150 C240,200 450,100 740,140 C1030,180 1280,70 1650,90" stroke="url(#ribbonGrad2)" stroke-width="1.3" stroke-dasharray="8 6" />
    <path d="M-50,130 C240,180 450,80 740,120 C1030,160 1280,50 1650,70" stroke="url(#ribbonGrad3)" stroke-width="1" />

    <!-- Stream 4 (Subtle Top Crest) -->
    <path d="M-50,70 C220,110 420,30 700,60 C980,90 1250,10 1650,30" stroke="url(#ribbonGrad1)" stroke-width="1.2" stroke-opacity="0.4" />
  </g>

  <!-- Precision Corner Coordinate Marker (Top Right & Bottom Right) -->
  <g fill="none" stroke="#34D399" stroke-opacity="0.25" stroke-width="1.2">
    <path d="M 1540 30 L 1570 30 L 1570 60" />
    <path d="M 1570 340 L 1570 370 L 1540 370" />
  </g>
</svg>
