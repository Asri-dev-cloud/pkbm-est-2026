<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Rich Vibrant Blue Gradient -->
    <linearGradient id="bgSkyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A5299" />
      <stop offset="40%" stop-color="#0E6EC4" />
      <stop offset="80%" stop-color="#1F9BFF" />
      <stop offset="100%" stop-color="#147CD6" />
    </linearGradient>

    <!-- Pure White Wave Gradient -->
    <linearGradient id="waveWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F6FC" />
    </linearGradient>

    <!-- Deep Blue Ribbon Separator -->
    <linearGradient id="waveDeepBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#073D73" />
      <stop offset="100%" stop-color="#0E64B2" />
    </linearGradient>

    <!-- Left Text Protective Scrim (Seamless full-canvas gradient, zero edges) -->
    <linearGradient id="textClarityShield" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#073A6E" stop-opacity="0.88" />
      <stop offset="25%" stop-color="#084785" stop-opacity="0.72" />
      <stop offset="45%" stop-color="#0A5A9E" stop-opacity="0.28" />
      <stop offset="62%" stop-color="#0E6EC4" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#0E6EC4" stop-opacity="0.0" />
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="softRibbonShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#052E57" flood-opacity="0.30" />
    </filter>

    <!-- Ambient Mascot Spotlight Glow (Full-canvas seamless radial overlay) -->
    <radialGradient id="mascotBackdrop" cx="82%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#1F9BFF" stop-opacity="0.10" />
      <stop offset="75%" stop-color="#1F9BFF" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#1F9BFF" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- 1. Deep Blue Canvas Base -->
  <rect width="1600" height="600" fill="url(#bgSkyBlue)" />

  <!-- 2. Groovy Liquid Wavy Ribbons across the Canvas -->
  <!-- Wave 1: White Ribbon Top -->
  <path d="M -50,-20 
           C 250,90 480,-40 780,60 
           C 1100,160 1350,-10 1650,70 
           L 1650,170 
           C 1350,90 1100,260 780,160 
           C 480,60 250,190 -50,80 Z" 
        fill="url(#waveWhite)" 
        filter="url(#softRibbonShadow)" />

  <!-- Wave 2: Deep Blue Ribbon -->
  <path d="M -50,130 
           C 260,240 500,100 810,210 
           C 1130,320 1370,140 1650,220 
           L 1650,300 
           C 1370,220 1130,400 810,290 
           C 500,180 260,320 -50,210 Z" 
        fill="url(#waveDeepBlue)" 
        opacity="0.75" />

  <!-- Wave 3: White Ribbon Center -->
  <path d="M -50,260 
           C 270,370 510,220 830,340 
           C 1150,450 1380,260 1650,350 
           L 1650,460 
           C 1380,370 1150,560 830,450 
           C 510,330 270,480 -50,370 Z" 
        fill="url(#waveWhite)" 
        filter="url(#softRibbonShadow)" />

  <!-- Wave 4: Deep Blue Ribbon -->
  <path d="M -50,410 
           C 280,510 520,370 850,470 
           C 1170,570 1400,390 1650,470 
           L 1650,540 
           C 1400,460 1170,640 850,540 
           C 520,440 280,580 -50,480 Z" 
        fill="url(#waveDeepBlue)" 
        opacity="0.7" />

  <!-- Wave 5: White Ribbon Bottom -->
  <path d="M -50,520 
           C 290,620 540,480 870,570 
           C 1190,660 1420,500 1650,580 
           L 1650,620 L -50,620 Z" 
        fill="url(#waveWhite)" 
        filter="url(#softRibbonShadow)" />

  <!-- 3. Left Side Seamless Soft Clarity Shield (Full 1600 width, completely seamless) -->
  <rect width="1600" height="600" fill="url(#textClarityShield)" />

  <!-- 4. Ambient Mascot Spotlight Area (Full 1600 width seamless glow, no circle boundaries) -->
  <rect width="1600" height="600" fill="url(#mascotBackdrop)" />
</svg>
